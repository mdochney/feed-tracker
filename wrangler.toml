name = "feed-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "feed-tracker"
# Replace with the id printed by: npx wrangler d1 create feed-tracker
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# Every 10 minutes, polling the POLL_BATCH sources that have waited longest.
crons = ["*/10 * * * *"]

[vars]
POLL_BATCH = "20"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   APP_TOKEN      - the password the page asks for
#   PRIVATE_FEEDS  - JSON map of source key to private feed URL, e.g. {"substack:samharris":"https://..."}

[observability]
enabled = true
