name = "feed-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "feed-tracker"
database_id = "c7dc8537-7db3-4e67-b500-0b5cd79b0eb3"
migrations_dir = "migrations"

[triggers]
# Every 10 minutes, polling the sources that have waited longest. On the free plan a run
# reaches about 40 sources, so around 340 sources are each checked every hour and a half.
crons = ["*/10 * * * *"]

[vars]
POLL_BATCH = "45"
# Outbound requests allowed per run. The free plan fails a run above 50; on Workers Paid
# raise this and POLL_BATCH together (for example 300 and 150).
FETCH_BUDGET = "45"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   APP_TOKEN      - the password the page asks for
#   PRIVATE_FEEDS  - JSON map of source key to private feed URL, e.g. {"substack:samharris":"https://..."}
#   YOUTUBE_API_KEY - YouTube Data API v3 key; without it YouTube falls back to the public feeds

[observability]
enabled = true
